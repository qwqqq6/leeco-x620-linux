Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AutoAddGPU" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Extensions"
    Option "GLX" "Disable"
EndSection

Section "Device"
    Identifier "X620Framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
EndSection

Section "Monitor"
    Identifier "X620Panel"
    DisplaySize 137 243
EndSection

Section "Screen"
    Identifier "X620Screen"
    Device "X620Framebuffer"
    Monitor "X620Panel"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "InputDevice"
    Identifier "X620Touch"
    Driver "libinput"
    Option "Device" "/dev/input/event17"
    Option "CorePointer" "true"
    Option "CalibrationMatrix" "1 0 0 0 1 0 0 0 1"
EndSection

Section "InputDevice"
    Identifier "X620Buttons"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
    Option "CoreKeyboard" "true"
EndSection

Section "ServerLayout"
    Identifier "X620Layout"
    Screen "X620Screen"
    InputDevice "X620Touch" "CorePointer"
    InputDevice "X620Buttons" "CoreKeyboard"
EndSection
