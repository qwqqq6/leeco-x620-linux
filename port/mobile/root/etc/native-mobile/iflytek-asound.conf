# Keep the manufacturer's 48 kHz stereo ADC format behind ALSA conversion.
# No ALSA hooks: routing is explicitly enabled and restored by a bounded helper.
pcm.native_mic {
    type plug
    slave {
        pcm "hw:0,1"
        format S16_LE
        channels 2
        rate 48000
    }
    hint {
        show on
        description "Le620 microphone"
    }
}
pcm.!default {
    type asym
    playback.pcm "null"
    capture.pcm "native_mic"
}
ctl.!default {
    type hw
    card 0
}
